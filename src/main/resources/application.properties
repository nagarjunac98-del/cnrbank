# Application Name
spring.application.name=CNRBANK

# Server Port
server.port=8083

# H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./data/cnrbankdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=system@123

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Database Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JSON Configuration
spring.jackson.serialization.indent-output=true

# SMTP settings for registration email OTP delivery. Set these environment variables locally.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Twilio and sender settings. Keep credentials out of source control.
app.otp.twilio-account-sid=${TWILIO_ACCOUNT_SID:}
app.otp.twilio-auth-token=${TWILIO_AUTH_TOKEN:}
app.otp.twilio-from-number=${TWILIO_FROM_NUMBER:}
app.otp.email-from=${SMTP_FROM:}